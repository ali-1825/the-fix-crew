<style>
  :root{ --navy:#1E3A5F; --orange:#F2600C; }

  #intro{
    position:fixed;inset:0;z-index:999;
    background:radial-gradient(ellipse at center, #24466f 0%, #12233a 100%);
    display:flex;align-items:center;justify-content:center;perspective:1200px;
    transition:opacity .55s cubic-bezier(.22,1,.36,1), transform .55s cubic-bezier(.22,1,.36,1);
  }
  #intro.hide{opacity:0;transform:translateY(-16px);pointer-events:none}

  .tool{position:absolute;width:64px;height:64px;opacity:0;transform-style:preserve-3d}
  .tool img{width:100%;height:100%;border-radius:16px;display:block;box-shadow:0 10px 24px rgba(0,0,0,.35)}
  .t1{top:8%;left:10%;animation:flyIn .6s ease-out .05s forwards}
  .t2{top:8%;right:10%;animation:flyIn .6s ease-out .1s forwards}
  .t3{top:40%;left:4%;animation:flyIn .6s ease-out .15s forwards}
  .t4{top:40%;right:4%;animation:flyIn .6s ease-out .2s forwards}
  .t5{bottom:8%;left:10%;animation:flyIn .6s ease-out .25s forwards}
  .t6{bottom:8%;right:10%;animation:flyIn .6s ease-out .3s forwards}
  @keyframes flyIn{
    0%{opacity:0;transform:translate3d(0,0,-400px) rotateY(180deg) scale(.3)}
    70%{opacity:1}
    100%{opacity:.9;transform:translate3d(0,0,0) rotateY(0deg) scale(1)}
  }

  #badge{
    width:190px;height:190px;border-radius:50%;background:#fff;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    opacity:0;transform:scale(.2) rotateY(0deg);
    animation:coinIn .8s cubic-bezier(.2,.8,.2,1) .35s forwards;
  }
  #badge img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
  @keyframes coinIn{
    0%{opacity:0;transform:scale(.3) rotateY(0deg)}
    55%{opacity:1;transform:scale(1.04) rotateY(180deg)}
    100%{opacity:1;transform:scale(1) rotateY(360deg)}
  }

  #intro-copy{
    position:absolute;bottom:16%;left:0;right:0;text-align:center;
    opacity:0;transform:translate3d(0,30px,-60px);
    animation:copyIn .55s ease-out 1.1s forwards;
  }
  @keyframes copyIn{ to{opacity:1;transform:translate3d(0,0,0)} }
  #intro-copy .line1{font-weight:800;font-size:19px;color:var(--orange);letter-spacing:.3px;padding:0 12%;line-height:1.35}
  #intro-copy .line2{font-weight:500;font-size:13px;color:#cbd5e1;margin-top:4px}
  @media(max-width:600px){
    .tool{width:44px;height:44px}
    .tool img{border-radius:11px}
    .t1{top:6%;left:6%}
    .t2{top:6%;right:6%}
    .t3{top:39%;left:3%}
    .t4{top:39%;right:3%}
    .t5{bottom:4%;left:6%}
    .t6{bottom:4%;right:6%}
    #badge{width:145px;height:145px}
    #intro-copy{bottom:12%}
    #intro-copy .line1{font-size:16px;padding:0 9%}
    #intro-copy .line2{font-size:11px}
  }
</style>
