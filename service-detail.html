<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service Details | The Fix Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F5F8FC;--panel:#FFF;--ink:#132043;--ink-soft:#5C6B8A;--blue:#2F6FED;--blue-deep:#1E4FC7;--amber:#FFA928;--mint:#1FBF8F;--line:#E3E9F5;box-sizing:border-box;}
  *,*::before,*::after{box-sizing:inherit;}
  html{scroll-behavior:smooth;scroll-padding-top:80px;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;line-height:1.55;}
  h1,h2,h3,.logo{font-family:Manrope,sans-serif;} a{color:inherit;}
  .wrap{max-width:1160px;margin:0 auto;padding:0 24px;}
  header{position:sticky;top:0;z-index:10;background:rgba(245,248,252,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;}
  .logo{font-weight:800;font-size:20px;text-decoration:none;display:flex;align-items:center;gap:8px;}.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--blue),var(--blue-deep));box-shadow:0 8px 16px -6px rgba(47,111,237,.5);}
  .navlinks{display:flex;align-items:center;gap:26px;}.navlinks ul{list-style:none;display:flex;gap:22px;margin:0;padding:0;color:var(--ink-soft);font-size:14px;}.navlinks a:hover{color:var(--ink);}
  .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:12px 20px;text-decoration:none;font-weight:700;font-size:14px;position:relative;transform:translateY(0) translateZ(0);transition:transform .2s ease,box-shadow .2s ease;box-shadow:0 5px 0 -2px rgba(19,32,67,.18),0 10px 18px -10px rgba(19,32,67,.4);}.btn:hover{transform:translateY(-3px) translateZ(4px);box-shadow:0 8px 0 -2px rgba(19,32,67,.2),0 16px 24px -10px rgba(19,32,67,.42);}.btn:active{transform:translateY(1px) translateZ(0);box-shadow:0 2px 0 -1px rgba(19,32,67,.18),0 5px 10px -8px rgba(19,32,67,.35);}.btn-primary{background:linear-gradient(145deg,var(--blue),var(--blue-deep));color:#fff;box-shadow:0 10px 20px -6px rgba(47,111,237,.5);}.btn-white{background:#fff;color:var(--blue-deep);}
  .hero{padding:68px 0 42px;background:linear-gradient(180deg,#EEF3FC,transparent);}.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:34px;align-items:center;}.eyebrow{color:var(--blue-deep);font-weight:800;font-size:14px;letter-spacing:.04em;margin-bottom:12px;}h1{font-size:clamp(36px,5vw,58px);line-height:1.05;margin:0 0 18px;}.hero p{color:var(--ink-soft);font-size:18px;max-width:58ch;margin:0 0 26px;}.hero-actions{display:flex;gap:12px;flex-wrap:wrap;}
  .hero-panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 20px 40px -20px rgba(19,32,67,.3);}.hero-panel .icon{font-size:48px;margin-bottom:18px;}.hero-panel h2{font-size:22px;margin:0 0 8px;}.hero-panel p{font-size:14px;margin:0;color:var(--ink-soft);}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:32px;}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;}.stat strong{display:block;font:800 22px Manrope,sans-serif;color:var(--blue-deep);}.stat span{font-size:12px;color:var(--ink-soft);}
  section{padding:52px 0;}.section-head{margin-bottom:24px;}.section-head h2{font-size:clamp(26px,3vw,36px);margin:0 0 8px;}.section-head p{margin:0;color:var(--ink-soft);}
  .jobs{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;perspective:1000px;}.job{position:relative;background:linear-gradient(145deg,#FFF,#F7FAFF);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;justify-content:space-between;gap:18px;align-items:flex-start;transform:rotateX(0deg) rotateY(0deg) translateZ(0);transform-style:preserve-3d;box-shadow:0 8px 0 -4px #DCE7F8,0 16px 28px -18px rgba(19,32,67,.5);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;}.job::after{content:'';position:absolute;inset:10px;border:1px solid rgba(255,255,255,.8);border-radius:11px;pointer-events:none;transform:translateZ(1px);}.job:hover{transform:rotateX(4deg) rotateY(-4deg) translateY(-7px) translateZ(10px);border-color:#BFD2FA;box-shadow:0 10px 0 -4px #BFD2FA,0 24px 34px -16px rgba(47,111,237,.42);}.job h3{margin:0;font-size:16px;position:relative;z-index:1;}.job p{margin:5px 0 0;font-size:13px;color:var(--ink-soft);position:relative;z-index:1;}.price{color:var(--blue-deep);font-weight:800;white-space:nowrap;font-family:Manrope,sans-serif;position:relative;z-index:1;}.muted{color:var(--ink-soft);font-size:13px;}
  .job a{color:var(--blue-deep);text-decoration:none;}.job a:hover{text-decoration:underline;}
  .job-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end;position:relative;z-index:1;}.add-btn{display:inline-flex;align-items:center;justify-content:center;background:var(--blue);color:#fff!important;border-radius:9px;padding:8px 13px;font:700 13px Manrope,sans-serif;text-decoration:none!important;box-shadow:0 4px 0 -1px var(--blue-deep),0 8px 12px -8px rgba(47,111,237,.55);transition:transform .2s ease,box-shadow .2s ease;}.add-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 -1px var(--blue-deep),0 12px 16px -8px rgba(47,111,237,.55);}.add-btn:active{transform:translateY(1px);box-shadow:0 2px 0 -1px var(--blue-deep);}
  .trust{background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}.trust-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start;}.trust ul{margin:0;padding:0;list-style:none;display:grid;gap:12px;color:var(--ink-soft);}.trust li::before{content:'✓';color:var(--mint);font-weight:800;margin-right:10px;}.cta{background:linear-gradient(150deg,var(--blue),var(--blue-deep));border-radius:22px;padding:36px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}.cta h2{margin:0 0 6px;font-size:26px;}.cta p{margin:0;color:#DCE7FF;}
  footer{border-top:1px solid var(--line);padding:32px 0;color:var(--ink-soft);font-size:14px;margin-top:28px;}.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  @media(max-width:760px){.wrap{padding:0 16px;}.nav{padding:12px 16px;}.navlinks{gap:10px;}.navlinks ul{gap:10px;font-size:12px;}.navlinks .btn{padding:10px 12px;font-size:12px;}.hero{padding-top:48px;}.hero-grid,.trust-grid{grid-template-columns:1fr;}.stats{gap:8px;}.stat{padding:12px;}.stat strong{font-size:18px;}.jobs{grid-template-columns:1fr;}.job{padding:16px;}}
</style>
</head>
<body>
<header><div class="nav wrap"><a class="logo" href="index.html"><span class="mark" aria-hidden="true"></span>The Fix Crew</a><div class="navlinks"><ul><li><a href="index.html">Home</a></li><li><a href="services.html">All Services</a></li><li><a href="services.html#rates">Rates</a></li></ul><a class="btn btn-primary" href="tel:+923000000000">Book a Fixer</a></div></div></header>
<main id="app"></main>
<footer><div class="wrap foot"><span>© 2026 The Fix Crew. All rights reserved.</span><span>Sargodha</span></div></footer>
<script>
const services = {
  ac: {icon:'❄️', eyebrow:'AC SERVICES', title:'Professional AC service at your door.', intro:'Get dependable AC service, installation and repair from a verified The Fix Crew technician.', summary:'Cooling, installation and repair for home AC units.', jobs:[['AC General Service','Routine service for 1 to 2.5 ton AC units.','Rs. 2,500','ac-general-service.html'],['AC Installation','Professional installation for 1 to 2.5 ton AC units.','Rs. 3,500','ac-job-detail.html?job=installation'],['AC Repairing','Diagnosis and repair for common AC faults.','Call for quote','ac-job-detail.html?job=repair'],['AC Mounting & Dismounting','Safe mounting or removal of your AC unit.','Call for quote','ac-job-detail.html?job=mounting'],['AC Dismounting','Indoor and outdoor unit removal with pipe dismounting.','Call for quote','ac-job-detail.html?job=dismounting']]},
  electrician: {icon:'⚡', eyebrow:'ELECTRICIAN SERVICES', title:'Reliable electrical work for your home.', intro:'From a single switch to new house wiring, get careful electrical work from a trained technician.', summary:'Professional electrical installation, repair and wiring.', jobs:[['UPS Installation - Without Wiring','UPS installation without wiring work.','Rs. 1,800'],['Electrical Wiring','Electrical wiring fault repair and small wiring jobs.','Rs. 800'],['Ceiling Fan, Exhaust Fan & Dimmer Switch','Installation and repair for fans and dimmer switches.','Call for quote'],['SMD, Fancy Lights & Tube Lights','Light installation for rooms and common areas.','Call for quote'],['LED TV/LCD Mounting','Wall mounting for 32 to 65 inch TVs.','Call for quote'],['Switchboard, Breaker & Power Plug','Replacement and installation of electrical fittings.','Call for quote'],['Water Pump Repair & New House Wiring','Pump repair and complete wiring support.','Call for quote'],['Change Over Switch & Distribution Box','Installation for safer power distribution.','Call for quote']]},
  plumber: {icon:'🔧', eyebrow:'PLUMBER SERVICES', title:'Fast plumbing help without the guesswork.', intro:'Get practical solutions for leaks, fittings, water motors, tanks and household plumbing.', summary:'Complete plumbing, water fitting and leakage solutions.', jobs:[['Muslim Shower Replacement','Replacement and fitting for bathroom showers.','Rs. 950'],['Mixer Tap & Single Tap Installation','Tap fitting and replacement.','Call for quote'],['Water Motor Installation & Repair','Water motor installation and repair.','Call for quote'],['Commode, Sink & Washbasin','Bathroom and kitchen fixture installation.','Call for quote'],['Leakage & Drain Blockage Repair','Kitchen, pipeline leakage and blocked drains.','Call for quote'],['Water Tank & Automatic Switch','Tank installation and automatic switch setup.','Call for quote'],['Gas Pipe Wiring & House Plumbing','House plumbing and gas pipe work.','Call for quote']]},
  carpenter: {icon:'🪚', eyebrow:'CARPENTER & HANDYMAN', title:'Skilled hands for the work around your home.', intro:'Get furniture repair, door work, locks and careful hanging services from one dependable crew.', summary:'Woodwork, furniture repair and home hanging services.', jobs:[['Room Door Lock Installation','New room door lock installation.','Rs. 1,500'],['Furniture, Wardrobe & Drawer Repair','Repair and adjustment for home furniture.','Call for quote'],['Door Installation & Repair','Door fitting, repair and carpenter work.','Call for quote'],['Curtain Rod, Art, Mirror & Shelf Hanging','Secure hanging and mounting around your home.','Call for quote'],['Drawer Lock & Catcher Replacement','Small hardware replacement and repair.','Call for quote']]},
  appliances: {icon:'🧰', eyebrow:'HOME APPLIANCES REPAIR', title:'Keep your essential appliances working.', intro:'Book help for washing machines, cooking ranges, ovens and kitchen hoods.', summary:'Repair and installation for essential home appliances.', jobs:[['Automatic Washing Machine Repair','Diagnosis and repair for automatic machines.','Rs. 1,000'],['Washing Machine Installation/Service','Automatic and manual machine installation or service.','Call for quote'],['Cooking Range & Oven Services','Inspection, service and repair for kitchen appliances.','Call for quote'],['Kitchen Hood Installation & Repair','Installation and repair for kitchen hoods.','Call for quote']]},
  geyser: {icon:'♨️', eyebrow:'GEYSER SERVICES', title:'Geyser installation and repair made simple.', intro:'Get gas and electric geyser support from technicians who can install, service and repair safely.', summary:'Gas and electric geyser installation, service and repair.', jobs:[['Gas Geyser Installation, Service & Repair','Installation, maintenance and repair for gas geysers.','Call for quote'],['Instant Geyser Installation & Repair','Electric and gas instant geyser support.','Call for quote'],['Instant Geyser Dismounting','Safe dismounting and removal service.','Call for quote']]},
  painter: {icon:'🎨', eyebrow:'PAINTER SERVICES', title:'A cleaner finish for every room and surface.', intro:'Refresh your home with indoor and outdoor paint, polishing and wooden surface work.', summary:'Interior, exterior and furniture finishing services.', jobs:[['House Paint','Indoor and outdoor house painting.','Call for quote'],['Gray Structure Paint','Painting support for gray structures.','Call for quote'],['Furniture, Table & Door Polishing','Polishing and finishing for wooden surfaces.','Call for quote'],['Window & Wooden Door Paint','Paint and finishing for windows and wooden doors.','Call for quote']]}
};
const key = new URLSearchParams(location.search).get('service') || 'ac';
const service = services[key] || services.ac;
document.title = service.eyebrow + ' | The Fix Crew';
document.getElementById('app').innerHTML = `
<section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">${service.eyebrow}</div><h1>${service.title}</h1><p>${service.intro}</p><div class="hero-actions"><a class="btn btn-primary" href="book-appointment.html?service=${encodeURIComponent(service.eyebrow)}">Book This Service</a><a class="btn btn-white" href="#jobs">See service list</a></div><div class="stats"><div class="stat"><strong>4.7★</strong><span>Average rating</span></div><div class="stat"><strong>60 min</strong><span>Typical arrival</span></div><div class="stat"><strong>1200+</strong><span>Jobs completed</span></div></div></div><aside class="hero-panel"><div class="icon">${service.icon}</div><h2>${service.eyebrow}</h2><p>${service.summary}</p></aside></div></section>
<section id="jobs"><div class="wrap"><div class="section-head"><h2>What we can help with</h2><p>Choose the job you need. We confirm the final quote before work begins.</p></div><div class="jobs">${service.jobs.map(job => `<article class="job"><div><h3>${job[3] ? `<a href="${job[3]}">${job[0]}</a>` : job[0]}</h3><p>${job[1]}</p></div><div class="job-actions"><span class="price">${job[2]}</span><a class="add-btn" href="book-appointment.html?service=${encodeURIComponent(job[0])}">Add</a></div></article>`).join('')}</div></div></section>
<section class="trust"><div class="wrap trust-grid"><div><div class="section-head"><h2>Why choose The Fix Crew?</h2><p>Simple booking, clear communication and technicians who respect your home.</p></div></div><ul><li>Verified and experienced technicians</li><li>Clear estimates before work starts</li><li>Fast response in our service areas</li><li>No hidden charges at the door</li><li>Support for common home service needs</li></ul></div></section>
<section><div class="wrap"><div class="cta"><div><h2>Need ${service.eyebrow.toLowerCase()} today?</h2><p>Call The Fix Crew and get help at your door.</p></div><a class="btn btn-white" href="tel:+923000000000">Call The Fix Crew</a></div></div></section>`;
</script>
</body>
