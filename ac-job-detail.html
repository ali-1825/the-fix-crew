<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AC Service Details | The Fix Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F5F8FC;--panel:#FFF;--ink:#132043;--ink-soft:#5C6B8A;--blue:#2F6FED;--blue-deep:#1E4FC7;--mint:#1FBF8F;--red:#D94D5C;--line:#E3E9F5;box-sizing:border-box;}
  *,*::before,*::after{box-sizing:inherit;} html{scroll-behavior:smooth;scroll-padding-top:80px;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;line-height:1.55;} h1,h2,.logo{font-family:Manrope,sans-serif;} a{color:inherit;}
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px;} header{position:sticky;top:0;z-index:10;background:rgba(245,248,252,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;}.logo{font-weight:800;font-size:20px;text-decoration:none;display:flex;align-items:center;gap:8px;}.logo img{display:block;height:42px;width:auto;max-width:220px;object-fit:contain;}.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--blue),var(--blue-deep));}
  .navlinks{display:flex;align-items:center;gap:22px;}.navlinks ul{list-style:none;display:flex;gap:20px;margin:0;padding:0;color:var(--ink-soft);font-size:14px;}.navlinks a:hover{color:var(--ink);}
  .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:12px 20px;text-decoration:none;font-weight:700;font-size:14px;position:relative;transform:translateY(0) translateZ(0);transition:transform .2s ease,box-shadow .2s ease;box-shadow:0 5px 0 -2px rgba(19,32,67,.18),0 10px 18px -10px rgba(19,32,67,.4);}.btn:hover{transform:translateY(-3px) translateZ(4px);box-shadow:0 8px 0 -2px rgba(19,32,67,.2),0 16px 24px -10px rgba(19,32,67,.42);}.btn:active{transform:translateY(1px) translateZ(0);box-shadow:0 2px 0 -1px rgba(19,32,67,.18),0 5px 10px -8px rgba(19,32,67,.35);}.btn-primary{background:linear-gradient(145deg,var(--blue),var(--blue-deep));color:#fff;box-shadow:0 10px 20px -6px rgba(47,111,237,.5);}.btn-ghost{background:var(--panel);border:1px solid var(--line);}.btn-white{background:#fff;color:var(--blue-deep);}
  .hero{padding:68px 0 40px;background:linear-gradient(180deg,#EEF3FC,transparent);}.eyebrow{color:var(--blue-deep);font-weight:800;font-size:14px;letter-spacing:.04em;margin-bottom:12px;}h1{font-size:clamp(34px,5vw,54px);line-height:1.06;margin:0 0 16px;max-width:760px;}.hero p{color:var(--ink-soft);font-size:18px;max-width:650px;margin:0 0 24px;}.hero-actions{display:flex;gap:12px;flex-wrap:wrap;}.price{display:inline-block;color:var(--blue-deep);font:800 22px Manrope,sans-serif;background:#EAF2FF;border-radius:10px;padding:8px 14px;}
  section{padding:42px 0;}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px;}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 1px 2px rgba(19,32,67,.06);}.panel h2{font-size:24px;margin:0 0 16px;}.panel ul{list-style:none;margin:0;padding:0;display:grid;gap:14px;}.panel li{display:flex;gap:10px;align-items:flex-start;color:var(--ink-soft);}.included li::before{content:'✓';color:var(--mint);font-weight:800;font-size:18px;line-height:1.2;}.excluded li::before{content:'×';color:var(--red);font-weight:800;font-size:20px;line-height:1.1;}.note{margin:22px 0 0;color:var(--ink-soft);font-size:14px;}.cta{margin-top:20px;background:linear-gradient(150deg,var(--blue),var(--blue-deep));border-radius:20px;padding:30px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;}.cta h2{margin:0 0 6px;font-size:25px;}.cta p{margin:0;color:#DCE7FF;}
  footer{border-top:1px solid var(--line);padding:30px 0;color:var(--ink-soft);font-size:14px;}.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  @media(max-width:700px){.wrap{padding:0 16px;}.nav{padding:12px 16px;}.navlinks{gap:10px;}.navlinks ul{gap:10px;font-size:12px;}.navlinks .btn{padding:10px 12px;font-size:12px;}.hero{padding-top:48px;}.columns{grid-template-columns:1fr;}.panel{padding:22px;}}
</style>
</head>
<body>
<header><div class="nav wrap"><a class="logo" href="index.html"><img src="Logo.jpg.jpeg" alt="The Fix Crew logo" /></a><div class="navlinks"><ul><li><a href="index.html">Home</a></li><li><a href="services.html">All Services</a></li><li><a href="service-detail.html?service=ac">AC Services</a></li></ul><a class="btn btn-primary" href="book-appointment.html">Book a Fixer</a></div></div></header>
<main id="app"></main>
<footer><div class="wrap foot"><span>© 2026 The Fix Crew. All rights reserved.</span><span>Sargodha</span></div></footer>
<script>
const jobs = {
  installation:{title:'AC Installation',intro:'Book AC installation with The Fix Crew. Get a clear scope and verified professionals.',price:'Rs. 3,500',includes:['Mounting of indoor unit','Mounting of outdoor unit','AC pipe installation within 10 feet'],excludes:['AC pipe installation more than 10 feet','Any type of repair','Any type of material','Any type of gas','Ladder','Underground and ceiling piping']},
  repair:{title:'AC Repairing',intro:'Book AC repairing with The Fix Crew. Our technician inspects the unit before repair work begins.',price:'Call for quote',includes:['AC inspection','AC gas check','AC gas leakage check','Repair charges decided after inspection'],excludes:['Any type of material','Any type of gas','Ladder']},
  mounting:{title:'AC Mounting and Dismounting',intro:'Book AC mounting and dismounting with The Fix Crew. We move your units carefully from one location to another.',price:'Call for quote',includes:['Dismount the indoor and outdoor unit from one place','Mount the indoor and outdoor unit to a second place'],excludes:['Logistics of AC','Any type of repair','Any type of material','Any type of gas','Ladder','Underground and ceiling piping','Installation of AC pipe more than 10 feet']},
  dismounting:{title:'AC Dismounting',intro:'Book AC dismounting with The Fix Crew. We remove the AC units and pipe carefully.',price:'Call for quote',includes:['Dismounting of indoor unit','Dismounting of outdoor unit','AC pipe dismounting'],excludes:['Any type of repair','Any type of material','Ladder','Underground and ceiling piping dismounting']}
};
const job=jobs[new URLSearchParams(location.search).get('job')]||jobs.installation;
document.title=job.title+' | The Fix Crew';
document.getElementById('app').innerHTML=`<section class="hero"><div class="wrap"><div class="eyebrow">AC SERVICES</div><h1>${job.title}</h1><p>${job.intro}</p><span class="price">${job.price}</span><div class="hero-actions" style="margin-top:24px;"><a class="btn btn-primary" href="book-appointment.html?service=${encodeURIComponent(job.title)}">Book This Service</a><a class="btn btn-ghost" href="#scope">View service scope</a></div></div></section><section id="scope"><div class="wrap"><div class="columns"><article class="panel"><h2>Includes</h2><ul class="included">${job.includes.map(item=>`<li>${item}</li>`).join('')}</ul></article><article class="panel"><h2>Does not include</h2><ul class="excluded">${job.excludes.map(item=>`<li>${item}</li>`).join('')}</ul></article></div><p class="note">The listed scope covers the services above. Any additional work or material will be discussed and quoted separately before it starts.</p><div class="cta"><div><h2>Ready to book?</h2><p>Call The Fix Crew for a clear quote and a technician at your door.</p></div><a class="btn btn-white" href="book-appointment.html?service=${encodeURIComponent(job.title)}">Call The Fix Crew</a></div></div></section>`;
</script>
<script>document.querySelectorAll('.navlinks').forEach(nav=>{if(!nav.querySelector('a[href="about-us.html"]')){const link=document.createElement('a');link.href='about-us.html';link.textContent='About Us';nav.insertBefore(link,nav.lastElementChild);}});</script>
</body>
</html>
